services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: lostlink
      POSTGRES_USER: lostlink
      POSTGRES_PASSWORD: lostlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostlink -d lostlink"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://lostlink:lostlink@db:5432/lostlink
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      UPLOAD_DIR: /app/uploads
      HF_HOME: /app/hf_cache
      JWT_SECRET: CHANGE_ME_LOCAL_ONLY
    volumes:
      - ../backend/uploads:/app/uploads
      - hf_cache:/app/hf_cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_URL: /api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  hf_cache:
